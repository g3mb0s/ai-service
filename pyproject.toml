[project]
name = "gembos-ai-service"
version = "0.1.0"
description = "Async AI chat and exercise generation service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.12.14",
    "aiofiles>=25.1.0",
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastapi[all]>=0.135.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "minio>=7.2.20",
    "prometheus-fastapi-instrumentator>=7.1.0",
    "psycopg2-binary>=2.9.11",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "pyjwt>=2.12.1",
    "redis[hiredis]>=7.4.0",
    "sqladmin[full]>=0.24.0",
    "sqlalchemy>=2.0.48",
    "cryptography>=46.0.6",
    "openai>=2.14.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
